<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBellatrix" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08071A" />
      <stop offset="50%" stop-color="#140E2E" />
      <stop offset="100%" stop-color="#060514" />
    </linearGradient>
    <linearGradient id="indigoCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="pinkGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <filter id="amazonSuperGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgBellatrix)" />

  <!-- Constellation lines -->
  <g opacity="0.18" stroke="#818CF8" stroke-width="1.5">
    <circle cx="280" cy="190" r="5" fill="#EC4899" />
    <circle cx="440" cy="260" r="6" fill="#FFFFFF" />
    <circle cx="600" cy="210" r="7" fill="#818CF8" />
    <circle cx="760" cy="260" r="6" fill="#FFFFFF" />
    <circle cx="920" cy="190" r="5" fill="#EC4899" />
    <line x1="280" y1="190" x2="440" y2="260" />
    <line x1="440" y1="260" x2="600" y2="210" />
    <line x1="600" y1="210" x2="760" y2="260" />
    <line x1="760" y1="260" x2="920" y2="190" />
  </g>

  <!-- Big Hero Star Aura -->
  <g transform="translate(600, 210)">
    <circle cx="0" cy="0" r="105" fill="url(#indigoCoreGrad)" opacity="0.35" filter="url(#amazonSuperGlow)" />
    <!-- 8-Point Geometric Ray -->
    <polygon points="0,-105 24,-28 105,-20 32,24 68,96 0,38 -68,96 -32,24 -105,-20 -24,-28" fill="url(#indigoCoreGrad)" />
    <!-- Inner Pink Amazon Star -->
    <polygon points="0,-72 14,-20 72,0 14,20 0,72 -14,20 -72,0 -14,-20" fill="url(#pinkGlow)" opacity="0.95" />
    <!-- Core -->
    <circle cx="0" cy="0" r="20" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="10" fill="#4F46E5" />
  </g>

  <!-- Typography -->
  <text x="600" y="380" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="60" font-weight="900" letter-spacing="3" fill="#FFFFFF">
    BELLATRIX<tspan fill="#818CF8">PORTAL</tspan>
  </text>
  
  <text x="600" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#EC4899">
    ENTERPRISE INTERNAL ADMIN &amp; CLIENT PORTAL OS
  </text>

  <text x="600" y="470" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" letter-spacing="2" fill="#94A3B8">
    React 19 • Headless Data Providers • AntD &amp; Tailwind • PostgreSQL &amp; Supabase Connectors
  </text>

  <!-- Feature Pills -->
  <g transform="translate(600, 535)">
    <g transform="translate(-330, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">100% MIT Licensed</text>
    </g>
    <g transform="translate(-110, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1E293B" stroke="#818CF8" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#818CF8">React 19 &amp; Vite</text>
    </g>
    <g transform="translate(110, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1E293B" stroke="#EC4899" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#EC4899">Zero License Traps</text>
    </g>
    <g transform="translate(330, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Turnkey Docker</text>
    </g>
  </g>
</svg>
