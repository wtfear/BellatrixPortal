<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bellatrixCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="amazonAura" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <linearGradient id="whiteText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#0B0F19" rx="16" />

  <!-- Grid Background -->
  <g opacity="0.14" stroke="#818CF8" stroke-width="1.2">
    <line x1="40" y1="20" x2="760" y2="20" />
    <line x1="40" y1="110" x2="760" y2="110" />
    <line x1="40" y1="200" x2="760" y2="200" />
    <circle cx="110" cy="110" r="85" stroke-dasharray="3 5" fill="none" />
  </g>

  <!-- Bellatrix Star Icon (Gamma Orionis - Amazon Star & Portal Shield) -->
  <g transform="translate(110, 110)">
    <circle cx="0" cy="0" r="54" fill="url(#bellatrixCore)" opacity="0.32" filter="url(#starGlow)" />
    
    <!-- Outer Shield Diamond -->
    <polygon points="0,-68 18,-18 68,0 18,18 0,68 -18,18 -68,0 -18,-18" fill="url(#bellatrixCore)" />
    <!-- Inner Radiant Spark -->
    <polygon points="0,-42 10,-10 42,0 10,10 0,42 -10,10 -42,0 -10,-10" fill="url(#amazonAura)" opacity="0.95" />
    
    <!-- Core Singularity -->
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="7" fill="#4F46E5" />
  </g>

  <!-- Typography -->
  <text x="220" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="50" font-weight="900" letter-spacing="2" fill="url(#whiteText)">
    BELLATRIX<tspan fill="#818CF8">PORTAL</tspan>
  </text>
  
  <text x="222" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" letter-spacing="4" fill="#EC4899">
    ENTERPRISE INTERNAL ADMIN &amp; CLIENT PORTAL OS
  </text>

  <text x="222" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" letter-spacing="1.5" fill="#94A3B8">
    REACT 19 • TYPESCRIPT • TAILWIND &amp; ANTD • REST / GRAPHQL / SUPABASE
  </text>

  <!-- MIT Badge -->
  <g transform="translate(680, 42)">
    <rect x="-40" y="-14" width="80" height="26" rx="13" fill="#1E293B" stroke="#818CF8" stroke-width="1.5" />
    <circle cx="-24" cy="-1" r="4" fill="#10B981" />
    <text x="-12" y="3" font-family="sans-serif" font-size="10" font-weight="700" fill="#E2E8F0" letter-spacing="1">MIT</text>
  </g>
</svg>
